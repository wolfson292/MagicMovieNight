# MagicMovieNight.
#
# Joins an existing external bridge network so it can reach Tautulli (and Sonarr,
# Radarr, Plex) by container name, and so a reverse proxy on that network can serve
# it. Postgres stays on a private network — nothing outside this stack talks to it.
#
# Set MEDIA_NETWORK to whatever your media containers already share.

services:
  app:
    # Published by CI on every push to main. Deliberately no `build:` key — Portainer
    # has no build context, so a build directive makes this file undeployable there.
    # For local development use the override: docker compose -f compose.yaml -f compose.dev.yaml up
    image: ghcr.io/wolfson292/magicmovienight:latest
    container_name: magicmovienight
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__MovieNight: "Host=db;Database=magicmovienight;Username=magicmovienight;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}"
      Tautulli__BaseUrl: "${TAUTULLI_URL:-http://tautulli:8181}"
      Tautulli__ApiKey: "${TAUTULLI_API_KEY}"
      Trakt__ClientId: "${TRAKT_CLIENT_ID}"
      Trakt__ClientSecret: "${TRAKT_CLIENT_SECRET}"
      Trakt__User: "${TRAKT_USER:-me}"
      Sonarr__BaseUrl: "${SONARR_URL}"
      Sonarr__ApiKey: "${SONARR_API_KEY}"
      Radarr__BaseUrl: "${RADARR_URL}"
      Radarr__ApiKey: "${RADARR_API_KEY}"
      Tmdb__ApiToken: "${TMDB_API_TOKEN}"
      Tmdb__WatchRegion: "${TMDB_REGION:-US}"
      Claude__Model: "${CLAUDE_MODEL:-claude-opus-5}"
      TZ: "${TZ:-UTC}"
    volumes:
      # Keeps the Trakt refresh token across redeploys so pairing is a one-time job.
      - config:/config
    ports:
      - "${APP_PORT:-8100}:8080"
    networks:
      - media
      - internal

  db:
    image: postgres:16-alpine
    container_name: magicmovienight-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: magicmovienight
      POSTGRES_USER: magicmovienight
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      # The app applies migrations on boot, so it must not start before Postgres is
      # actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -U magicmovienight -d magicmovienight"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  db:
  config:

networks:
  media:
    external: true
    name: "${MEDIA_NETWORK:-media}"
  internal:
